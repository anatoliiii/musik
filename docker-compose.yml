services:
  player:
    image: ghcr.io/${MUSIK_IMAGE_OWNER:-anatoliiii}/musik-player:${MUSIK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.player
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      MUSIK_DATABASE_URL: ${MUSIK_DATABASE_URL:-sqlite:////data/db/musik.db}
      MUSIK_SCHEMA_MANAGED: "1"
      MUSIK_DATA_DIR: /data
      MUSIK_THEMES: /data/themes
      MUSIK_LIBRARY: /music
      MUSIK_WORKER_URL: http://worker:8790
      MUSIK_WORKER_AUTOSTART: "0"
      MUSIK_PLAYER_ADDR: ":8787"
    volumes:
      - musik-data:/data
      - ${MUSIK_LIBRARY:-./data/music}:/music
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8787/api/health]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/${MUSIK_IMAGE_OWNER:-anatoliiii}/musik-worker:${MUSIK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      MUSIK_DATABASE_URL: ${MUSIK_DATABASE_URL:-sqlite:////data/db/musik.db}
      MUSIK_LIBRARY: /music
      MUSIK_SCHEMA_MANAGED: "1"
      MUSIK_DATA_DIR: /data
      MUSIK_EMBEDDINGS_CACHE: /data/cache/embeddings
      MUSIK_ARTWORK_CACHE: /data/cache/artwork
      MUSIK_WORKER_ADDR: 0.0.0.0:8790
      MUSIK_PLAYER_RELOAD_URL: http://player:8787/api/reload
      MUSIK_NIGHTLY_MIXES_TIMEZONE: ${MUSIK_NIGHTLY_MIXES_TIMEZONE:-UTC}
    volumes:
      - musik-data:/data
      - ${MUSIK_LIBRARY:-./data/music}:/music:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=2))['status'] == 'ready'"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # no ports: — internal only
    restart: unless-stopped

  migrate:
    image: ghcr.io/${MUSIK_IMAGE_OWNER:-anatoliiii}/musik-migrate:${MUSIK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.migrate
    env_file: .env
    environment:
      MUSIK_DATABASE_URL: ${MUSIK_DATABASE_URL:-sqlite:////data/db/musik.db}
      MUSIK_DATA_DIR: /data
      MUSIK_WRITERS_STOPPED: ${MUSIK_WRITERS_STOPPED:-0}
    volumes:
      - musik-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

  postgres:
    image: postgres:17-bookworm
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${MUSIK_POSTGRES_DB:-musik}
      POSTGRES_USER: ${MUSIK_POSTGRES_USER:-musik}
      POSTGRES_PASSWORD: ${MUSIK_POSTGRES_PASSWORD:-}
    volumes:
      - musik-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  musik-postgres:
  musik-data:
