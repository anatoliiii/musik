name: images

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: player
            dockerfile: Dockerfile.player
          - name: worker
            dockerfile: Dockerfile.worker
          - name: migrate
            dockerfile: Dockerfile.migrate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/musik-${{ matrix.name }}
          tags: type=raw,value=build-${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/musik
          tags: |
            type=ref,event=branch,prefix=branch-
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Promote the complete build
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          mapfile -t tags < <(jq -r '.tags[] | split(":")[-1]' <<< "$TAGS_JSON")
          for service in player worker migrate; do
            image="ghcr.io/$owner/musik-$service"
            args=()
            for tag in "${tags[@]}"; do args+=(--tag "$image:$tag"); done
            docker buildx imagetools create "${args[@]}" "$image:build-$REVISION"
          done
