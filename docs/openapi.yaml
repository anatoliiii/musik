openapi: 3.0.3
info:
  title: musik API
  version: 1.0.0
  description: Music player API. Legacy single-user password/token auth or invite-gated
    multi-user OIDC with revocable sessions. In multi-user mode personal endpoints
    resolve the active profile from the server session; state-changing requests require
    X-CSRF-Token. Shared password and bearer token authentication are disabled in
    multi-user mode.
  x-musik-schema-version: 7
servers:
- url: http://127.0.0.1:8787
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: musik_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required together with the session cookie for multi-user state
        changes.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
    Track:
      type: object
      properties:
        id:
          type: integer
        artist:
          type: string
        title:
          type: string
        album:
          type: string
        duration:
          type: number
        stream:
          type: string
        artwork:
          type: string
        impression_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        request_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        source:
          type: string
        passport:
          $ref: '#/components/schemas/TrackPassport'
    TrackPassport:
      type: object
      description: Technical card of the file; only on GET /api/tracks/{id}. Fields
        are omitted when unknown.
      properties:
        format:
          type: string
          description: Upper-case file extension, e.g. FLAC, MP3
        bitrate:
          type: integer
          description: bits per second
        sample_rate:
          type: integer
        channels:
          type: integer
        lufs:
          type: number
        bpm:
          type: number
        key:
          type: string
        mode:
          type: string
          enum:
          - major
          - minor
    PlaybackEvent:
      type: object
      required:
      - type
      - event_id
      - track_id
      - session_id
      properties:
        type:
          type: string
          enum:
          - track_start
          - progress
          - track_end
          - skip
          - like
          - dislike
        event_id:
          type: string
          minLength: 1
        impression_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        track_id:
          type: integer
        session_id:
          type: string
        client_id:
          type: string
        device_id:
          type: string
        position_sec:
          type: number
        duration_sec:
          type: number
        listened_sec:
          type: number
        reason:
          type: string
          enum:
          - completed
          - skipped
          - next
          - ''
    ListeningProfile:
      type: object
      required:
      - id
      - name
      - is_default
      properties:
        id:
          type: string
        name:
          type: string
        is_default:
          type: boolean
    ProfileName:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
    InvitationRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        ttl_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
security:
- bearerAuth: []
- cookieAuth: []
paths:
  /api/health:
    get:
      security: []
      summary: Health
      responses:
        '200':
          description: OK
  /api/auth/login:
    post:
      security: []
      summary: Login with password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Sets musik_session cookie
        '401':
          description: Bad password
  /api/auth/logout:
    post:
      summary: Logout
      responses:
        '200':
          description: OK
  /api/auth/me:
    get:
      security: []
      summary: Auth status
      responses:
        '200':
          description: '{ok, auth_enabled}'
  /api/library:
    get:
      summary: Flat track list
      responses:
        '200':
          description: Track array
  /api/library/upload:
    post:
      summary: Upload audio files into MUSIK_LIBRARY
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                path:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: '{ok, saved, skipped, count}'
  /api/artists:
    get:
      summary: Artists
      responses:
        '200':
          description: '{artists, count}'
  /api/albums:
    get:
      summary: Albums
      responses:
        '200':
          description: '{albums, count}. Each album: artist, album, tracks, cover_track_id,
            artwork, and game=true when its files live under a "Steam OST" or "GOG
            OST" folder.'
  /api/tracks/{id}:
    get:
      summary: Track by id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Track
        '404':
          description: Not found
  /api/stream/{id}:
    get:
      summary: Audio stream (Range)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: q
        in: query
        description: Mobile transcode profile; omit for original media
        schema:
          type: string
          enum:
          - mobile
          - aac
          - mp3
      - name: fmt
        in: query
        description: Alias for q
        schema:
          type: string
          enum:
          - mobile
          - aac
          - mp3
      responses:
        '200':
          description: Original or transcoded audio
        '400':
          description: Invalid track id
        '404':
          description: Track or media file not found
  /api/radio/start:
    post:
      summary: Start radio session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seed_track_id:
                  type: integer
      responses:
        '200':
          description: session + current + queue
  /api/play:
    post:
      summary: Fixed listen (track/artist/album/ids)
      responses:
        '200':
          description: session + tracks
  /api/events:
    post:
      summary: Playback events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackEvent'
      responses:
        '200':
          description: ok / next
        '409':
          description: Legacy fallback matched more than one pending impression
  /api/mixes:
    get:
      summary: Mix shelves
      responses:
        '200':
          description: mixes
  /api/mixes/{kind}/play:
    post:
      summary: Play mix kind
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: session
  /api/favorites:
    get:
      summary: List favorites
      responses:
        '200':
          description: tracks/artists/albums
    post:
      summary: Add favorite
      responses:
        '200':
          description: ok
    delete:
      summary: Remove favorite
      responses:
        '200':
          description: ok
  /api/favorites/toggle:
    post:
      summary: Toggle favorite
      responses:
        '200':
          description: favorited
  /api/favorites/status:
    get:
      summary: Favorite status
      responses:
        '200':
          description: favorited bool
  /api/recommend/seed:
    get:
      summary: Similar tracks to seed
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - track
          - artist
          - album
      - name: track_id
        in: query
        schema:
          type: integer
      - name: artist
        in: query
        schema:
          type: string
      - name: album
        in: query
        schema:
          type: string
      responses:
        '200':
          description: tracks
  /api/recommend/favorites:
    get:
      summary: Recommend from favorites
      responses:
        '200':
          description: tracks/artists/albums
  /api/jobs:
    get:
      summary: List jobs
      parameters:
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: jobs
  /api/jobs/{kind}:
    post:
      summary: Enqueue job
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: job id
  /api/share/radio:
    post:
      summary: Create public continuous MP3 radio share link
      responses:
        '200':
          description: '{url, token}'
    get:
      summary: List radio share links
      responses:
        '200':
          description: '{shares, count}'
  /api/share/radio/{token}:
    delete:
      summary: Revoke share link
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ok
  /api/metrics/weekly:
    get:
      summary: Seven-day listening and recommendation outcomes
      responses:
        '200':
          description: Outcome/source/daypart/maturity/date slices and baseline readiness
  /api/metrics/recommendations:
    get:
      summary: Recommendation latency and 90-day outcome baseline
      responses:
        '200':
          description: 90-day outcomes, latency, last policy, training runs and explore/bandit
            state
  /listen/{token}:
    get:
      security: []
      summary: Continuous MP3 radio stream (public share token)
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: audio/mpeg stream
        '404':
          description: revoked or missing
        '503':
          description: ffmpeg missing or busy
  /api/openapi.json:
    get:
      security: []
      summary: OpenAPI spec
      responses:
        '200':
          description: OpenAPI JSON
  /api/status:
    get:
      summary: Player status
      responses:
        '200':
          description: Track, profile, and playback status
  /api/profile:
    get:
      summary: Taste profile
      responses:
        '200':
          description: Taste maturity, signals, and confidence
  /api/profile/explore:
    put:
      summary: Update explore bounds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                explore_lo:
                  type: number
                explore_hi:
                  type: number
      responses:
        '200':
          description: Clamped explore bounds and bandit readiness
  /api/artwork/{id}:
    get:
      summary: Track artwork
      description: JPEG thumbnails at 96, 256 or 640 px (other `w` values snap to
        nearest). Omit `w` to get 640. Pass `full=1` for the original embedded file.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: w
        in: query
        required: false
        description: Target width; snapped to 96, 256, or 640. Default 640.
        schema:
          type: integer
      - name: full
        in: query
        required: false
        description: If 1, serve the original artwork instead of a JPEG thumbnail.
        schema:
          type: integer
          enum:
          - 1
      responses:
        '200':
          description: Artwork image (image/jpeg thumbnail, or original for full=1)
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, max-age=2592000 for thumbnails; 86400 for full=1
  /api/similar/{id}:
    get:
      summary: Similar tracks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Similar track list
  /api/reload:
    post:
      summary: Reload player index
      responses:
        '200':
          description: Reload result
  /api/session/start:
    post:
      summary: Start playback session
      responses:
        '200':
          description: Session and queue
  /api/session/jump:
    post:
      summary: Jump within fixed session
      responses:
        '200':
          description: Updated session position
  /api/session/back:
    post:
      summary: Return to the previous track
      responses:
        '200':
          description: Updated session position
  /api/now:
    get:
      summary: Current playback state
      responses:
        '200':
          description: Current track and queue
  /api/tracks/{id}/lyrics:
    get:
      summary: Track lyrics
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Lyrics state and content
  /api/later:
    get:
      summary: List listen-later tracks
      responses:
        '200':
          description: Listen-later tracks
    post:
      summary: Add listen-later track
      responses:
        '200':
          description: Added track
    delete:
      summary: Remove listen-later track
      responses:
        '200':
          description: Removed track
  /api/similar/artists:
    get:
      summary: Similar artists
      responses:
        '200':
          description: Similar artist list
  /api/similar/albums:
    get:
      summary: Similar albums
      responses:
        '200':
          description: Similar album list
  /api/discover/albums:
    get:
      summary: Discover new albums
      responses:
        '200':
          description: New album tips
  /api/discover/resurfaced:
    get:
      summary: Discover resurfaced albums
      responses:
        '200':
          description: Resurfaced catalog tips
  /api/library/rescan:
    post:
      summary: Enqueue library rescan
      responses:
        '200':
          description: Job id aliases
  /api/jobs/{id}:
    get:
      summary: Get job
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Job status
  /manifest.webmanifest:
    get:
      summary: Web app manifest
      security: []
      responses:
        '200':
          description: Web app manifest
  /api/profiles:
    get:
      summary: List the caller profiles
      responses:
        '200':
          description: List the caller profiles
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/ListeningProfile'
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
    post:
      summary: Create an owned profile
      responses:
        '200':
          description: Create an owned profile
          content:
            application/json:
              schema: *id001
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileName'
  /api/profiles/{profile_id}:
    patch:
      summary: Rename an owned profile
      responses:
        '200':
          description: Rename an owned profile
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileName'
      parameters: &id002
      - name: profile_id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Soft-delete an owned non-last profile
      responses:
        '200':
          description: Soft-delete an owned non-last profile
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      parameters: *id002
  /api/profiles/{profile_id}/activate:
    post:
      summary: Switch the current server session profile
      responses:
        '200':
          description: Switch the current server session profile
          content:
            application/json:
              schema: *id001
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      parameters: *id002
  /api/admin/invitations:
    post:
      summary: Create an invite and return its secret once
      responses:
        '200':
          description: Create an invite and return its secret once
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
    get:
      summary: List invitation metadata without secrets
      responses:
        '200':
          description: List invitation metadata without secrets
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
  /api/admin/invitations/{id}:
    delete:
      summary: Revoke an unused invitation
      responses:
        '200':
          description: Revoke an unused invitation
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get invitation metadata without secrets
      responses:
        '200':
          description: Get invitation metadata without secrets
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/auth/oidc/default/start:
    get:
      summary: Start OIDC Authorization Code with PKCE
      responses:
        '302':
          description: Start OIDC Authorization Code with PKCE
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      parameters:
      - name: invitation
        in: query
        schema:
          type: string
      security: []
  /api/auth/oidc/default/callback:
    get:
      summary: Verify OIDC response and establish server session
      responses:
        '302':
          description: Verify OIDC response and establish server session
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          type: string
      security: []
  /api/admin/users:
    get:
      summary: List local accounts and status
      responses:
        '200':
          description: List local accounts and status
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
  /api/admin/users/{id}:
    patch:
      summary: Change account status or administrator role
      responses:
        '200':
          description: Change account status or administrator role
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - active
                  - disabled
                admin:
                  type: boolean
  /api/auth/oidc/default/link:
    post:
      summary: Start an authenticated OIDC identity link
      responses:
        '200':
          description: Start an authenticated OIDC identity link
          content:
            application/json:
              schema:
                type: object
                required:
                - authorization_url
                properties:
                  authorization_url:
                    type: string
                    format: uri
        '401':
          description: Sign-in required
        '403':
          description: Access, CSRF or invitation rejected
